global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          service: "postgresql"
          instance: "db"

  - job_name: "auth_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth_service:8082"]
        labels:
          service: "auth_service"

  - job_name: "profile_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["profile_service:8081"]
        labels:
          service: "profile_service"

  - job_name: "store_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["store_service:8080"]
        labels:
          service: "store_service"

  - job_name: "order_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["order_service:8084"]
        labels:
          service: "order_service"

  - job_name: "recommendation_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["recommendation_service:8085"]
        labels:
          service: "recommendation_service"

  # embedding_service
  # - job_name: "embedding_service"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["embedding_service:9100"]
  #       labels:
  #         service: "embedding_service"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          service: "node"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"
