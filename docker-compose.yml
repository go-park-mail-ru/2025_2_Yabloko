services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    command: redis-server --appendonly yes

  db:
    image: pgvector/pgvector:pg18
    container_name: db
    env_file: [ .env ]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PORT: 5432
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    command: >
      postgres
        -c log_destination=stderr
        -c logging_collector=off
        -c log_statement=all
        -c log_connections=on
        -c log_disconnections=on

  migrator:
    image: ghcr.io/jackc/tern:latest
    container_name: migrator
    depends_on:
      db:
        condition: service_healthy
    working_dir: /migrations
    volumes:
      - ./db/migrations:/migrations
    env_file: [ .env ]
    networks:
      - backend
    command: [ "migrate", "-m", "/migrations", "-c", "/migrations/tern.conf", "up" ]
    restart: "no"
    environment:
      - TERN_DEBUG=true

  auth_service:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    container_name: auth_service
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    env_file: [ .env ]
    networks:
      - backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_PORT: "${AUTH_PORT}"
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
    restart: unless-stopped
    labels:
      - "service.type=auth"
      - "log.format=json"

  profile_service:
    build:
      context: .
      dockerfile: ./profile_service/Dockerfile
    container_name: profile_service
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "${PROFILE_SERVICE_PORT}:${PROFILE_SERVICE_PORT}"
    env_file: [ .env ]
    networks:
      - backend
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PROFILE_SERVICE_PORT: "${PROFILE_SERVICE_PORT}"
      UPLOAD_PATH: ${UPLOAD_DIR:-/app/avatars}
      BASE_URL: http://localhost:${PROFILE_SERVICE_PORT}
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
    volumes:
      - ./.data/avatars:/app/avatars
    restart: unless-stopped
    labels:
      - "service.type=profile"
      - "log.format=json"

  store_service:
    build:
      context: .
      dockerfile: ./store_service/Dockerfile
    container_name: store_service
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      embedding_service:
        condition: service_healthy
    ports:
      - "${STORE_SERVICE_PORT}:${STORE_SERVICE_PORT}"
    env_file: [ .env ]
    networks:
      - backend
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_PORT: "${STORE_SERVICE_PORT}"
      AUTH_URL: http://auth_service:${AUTH_PORT}
      EMBEDDING_SERVICE_ADDR: ${EMBEDDING_SERVICE_ADDR}
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
    volumes:
      - ./uploads/stores:/app/stores
      - ./uploads/items:/app/items
    restart: unless-stopped
    labels:
      - "service.type=store"
      - "log.format=json"

  order_service:
    build:
      context: .
      dockerfile: ./order_service/Dockerfile
    container_name: order_service
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      auth_service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    env_file: [ .env ]
    networks:
      - backend
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_PORT: "${ORDER_SERVICE_PORT}"
      AUTH_URL: http://auth_service:${AUTH_PORT}
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET: ${CSRF_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
    restart: unless-stopped
    labels:
      - "service.type=order"
      - "log.format=json"

  embedding_service:
    build:
      context: .
      dockerfile: ./embedding_service/Dockerfile
    container_name: embedding_service
    env_file: [ .env ]
    networks:
      - backend
    environment:
      - GRPC_PORT=${GRPC_PORT}
      - MODEL_PATH=${MODEL_PATH}
      - VOCAB_PATH=${VOCAB_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./models:/models
    restart: unless-stopped
    labels:
      - "service.type=embedding"
      - "log.format=json"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/50051' && echo 'OK' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  dozzle:
    image: amir20/dozzle:latest
    container_name: doozle
    ports:
      - "${DOZZLE_PORT}:8080"
    networks:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - backend
    depends_on:
      - auth_service
      - profile_service
      - store_service
      - order_service
      - embedding_service
      - node_exporter
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=10GB'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    networks:
      - backend
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - backend
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    env_file: [ .env ]
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    restart: unless-stopped

volumes:
  db_data: {}
  redis_data: {}

networks:
  backend:
    driver: bridge
