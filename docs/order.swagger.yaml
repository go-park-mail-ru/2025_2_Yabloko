openapi: 3.0.3
info:
  title: Order Service API (8084 порт)
  version: "1.0.0"
  description: API для управления заказами юзеров

servers:
  - url: /api/v0

paths:
  /orders:
    get:
      summary: Список заказов пользователя
      operationId: getOrders
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
        - name: last_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - on_the_way
              - delivered
              - cancelled
        - name: desc
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
              example:
                - id: a1b2c3d4-e5f6-4000-8000-000000000001
                  status: pending
                  total: 2999.99
                  created_at: "2025-11-10T01:05:10Z"
                  store_id: store-uuid-1
                  store_name: "Apple Store"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Создать заказ из корзины
      operationId: createOrder
      responses:
        "200":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderInfo"
              example:
                id: a1b2c3d4-e5f6-4000-8000-000000000001
                stores:
                  - id: store-uuid-1
                    name: "Apple Store"
                    card_img: "apple-store.jpg"
                    items:
                      - id: item-uuid-1
                        name: "iPhone 16 Pro"
                        card_img: "iphone16pro.jpg"
                        price: 2999.99
                        quantity: 1
                status: pending
                total: 2999.99
                created_at: "2025-11-10T01:05:10Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/{id}:
    get:
      summary: Детали заказа
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderInfo"
              example:
                id: a1b2c3d4-e5f6-4000-8000-000000000001
                stores:
                  - id: store-uuid-1
                    name: "Apple Store"
                    card_img: "apple-store.jpg"
                    items:
                      - id: item-uuid-1
                        name: "iPhone 16 Pro"
                        card_img: "iphone16pro.jpg"
                        price: 2999.99
                        quantity: 1
                  - id: store-uuid-2
                    name: "Mac Store"
                    card_img: "mac-store.jpg"
                    items:
                      - id: item-uuid-2
                        name: "MacBook Pro"
                        card_img: "macbookpro.jpg"
                        price: 4999.99
                        quantity: 1
                status: pending
                total: 7999.98
                created_at: "2025-11-10T01:05:10Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{id}/status:
    patch:
      summary: Отменить заказ
      description: 'Разрешено ТОЛЬКО для статуса ''pending''. Тело: { "status": "cancelled" }'
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
            example:
              status: cancelled
      responses:
        "204":
          description: Статус обновлён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /fake-payment:
    get:
      summary: Заглушка оплаты (публичная)
      description: Возвращает HTML-страницу имитации оплаты. Автоматически редиректит на `return_url?payment_status=succeeded|canceled`.
      operationId: fakePayment
      security: []
      parameters:
        - name: order_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: return_url
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: price
          in: query
          required: false
          schema:
            type: string
            description: Сумма оплаты (опционально, если не указана - будет сгенерирована случайная)
          example: "2999.99"
      responses:
        "200":
          description: HTML-страница оплаты
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - paid
            - on_the_way
            - delivered
            - cancelled
        total:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        store_id:
          type: string
        store_name:
          type: string
      required:
        - id
        - status
        - total
        - created_at
    OrderInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stores:
          type: array
          description: Массив магазинов с товарами
          items:
            $ref: "#/components/schemas/StoreInfo"
        status:
          type: string
          enum:
            - pending
            - paid
            - on_the_way
            - delivered
            - cancelled
        total:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
      required:
        - id
        - stores
        - status
        - total
        - created_at
    StoreInfo:
      type: object
      properties:
        id:
          type: string
          description: store_id
        name:
          type: string
          description: Название магазина
        card_img:
          type: string
          description: Изображение магазина
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInfo"
      required:
        - id
        - name
        - card_img
        - items
    OrderItemInfo:
      type: object
      properties:
        id:
          type: string
          description: store_item_id
        name:
          type: string
        card_img:
          type: string
        price:
          type: number
          format: float
        quantity:
          type: integer
      required:
        - id
        - name
        - card_img
        - price
        - quantity
    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
            - cancelled
      required:
        - status
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
          example:
            error:
              code: invalid_request
              message: Некорректный ID заказа
    Unauthorized:
      description: Неавторизован
      content:
        application/json:
          example:
            error:
              code: unauthorized
              message: Неавторизован
    Forbidden:
      description: Доступ запрещён
      content:
        application/json:
          example:
            error:
              code: forbidden
              message: Нельзя отменить оплаченный заказ
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          example:
            error:
              code: not_found
              message: Заказ не найден
    InternalServerError:
      description: Внутренняя ошибка сервера
